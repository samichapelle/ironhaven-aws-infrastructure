---
- name: Configure CloudWatch monitoring
  hosts: management
  become: true

  vars:
    cloudwatch_agent_config_path: /opt/aws/amazon-cloudwatch-agent/etc/ironhaven-cloudwatch-agent.json

  tasks:
    - name: Install Amazon CloudWatch agent
      ansible.builtin.dnf:
        name: amazon-cloudwatch-agent
        state: present

    - name: Configure Amazon CloudWatch agent
      ansible.builtin.copy:
        dest: "{{ cloudwatch_agent_config_path }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "agent": {
              "metrics_collection_interval": 60,
              "run_as_user": "root"
            },
            "metrics": {
              "namespace": "Ironhaven/Management",
              "append_dimensions": {
                "InstanceId": "${aws:InstanceId}"
              },
              "aggregation_dimensions": [
                [
                  "InstanceId"
                ]
              ],
              "metrics_collected": {
                "mem": {
                  "measurement": [
                    "mem_used_percent"
                  ],
                  "metrics_collection_interval": 60
                },
                "disk": {
                  "measurement": [
                    "used_percent"
                  ],
                  "metrics_collection_interval": 60,
                  "resources": [
                    "/"
                  ]
                }
              }
            },
            "logs": {
              "force_flush_interval": 15,
              "logs_collected": {
                "files": {
                  "collect_list": [
                    {
                      "file_path": "/var/log/cloud-init-output.log",
                      "log_group_name": "/ironhaven/management/system",
                      "log_stream_name": "{instance_id}/cloud-init",
                      "retention_in_days": -1
                    },
                    {
                      "file_path": "/var/log/audit/audit.log",
                      "log_group_name": "/ironhaven/management/audit",
                      "log_stream_name": "{instance_id}/audit",
                      "retention_in_days": -1
                    },
                    {
                      "file_path": "/var/lib/docker/containers/*/*.log",
                      "log_group_name": "/ironhaven/management/containers",
                      "log_stream_name": "{instance_id}/docker",
                      "retention_in_days": -1
                    }
                  ]
                }
              }
            }
          }
      notify: Apply CloudWatch agent configuration

    - name: Enable and start Amazon CloudWatch agent
      ansible.builtin.service:
        name: amazon-cloudwatch-agent
        state: started
        enabled: true

    - name: Apply pending CloudWatch configuration
      ansible.builtin.meta: flush_handlers

    - name: Check Amazon CloudWatch agent status
      ansible.builtin.command:
        cmd: /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a status
      register: cloudwatch_agent_status
      changed_when: false

    - name: Verify Amazon CloudWatch agent is running
      ansible.builtin.assert:
        that:
          - "'running' in cloudwatch_agent_status.stdout"
        success_msg: "Amazon CloudWatch agent is running."
        fail_msg: "Amazon CloudWatch agent is not running."

    - name: Display Amazon CloudWatch agent status
      ansible.builtin.debug:
        var: cloudwatch_agent_status.stdout

  handlers:
    - name: Apply CloudWatch agent configuration
      ansible.builtin.command:
        cmd: >-
          /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl
          -a fetch-config
          -m ec2
          -s
          -c file:{{ cloudwatch_agent_config_path }}
      changed_when: true
