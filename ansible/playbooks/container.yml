---
- name: Build and deploy Ironhaven Nginx container
  hosts: management
  become: true

  vars:
    ironhaven_nginx_root: /opt/ironhaven/nginx
    ironhaven_nginx_build_root: /opt/ironhaven/nginx/build
    ironhaven_web_root: /opt/ironhaven/nginx/html
    ironhaven_container_name: ironhaven-nginx
    ironhaven_nginx_image: ironhaven-nginx
    ironhaven_nginx_image_tag: 1.30.5-alpine-patched
    ironhaven_local_port: 8080

  tasks:
    - name: Install Docker and its Python SDK
      ansible.builtin.dnf:
        name:
          - docker
          - python3-docker
        state: present

    - name: Enable and start Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Ironhaven Nginx directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ ironhaven_nginx_root }}"
        - "{{ ironhaven_nginx_build_root }}"
        - "{{ ironhaven_web_root }}"

    - name: Copy Ironhaven Nginx Dockerfile
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/nginx/Dockerfile"
        dest: "{{ ironhaven_nginx_build_root }}/Dockerfile"
        owner: root
        group: root
        mode: "0644"

    - name: Build patched Ironhaven Nginx image
      community.docker.docker_image:
        name: "{{ ironhaven_nginx_image }}"
        tag: "{{ ironhaven_nginx_image_tag }}"
        source: build
        build:
          path: "{{ ironhaven_nginx_build_root }}"
          pull: true
        state: present

    - name: Create Ironhaven demonstration page
      ansible.builtin.copy:
        dest: "{{ ironhaven_web_root }}/index.html"
        owner: root
        group: root
        mode: "0644"
        content: |
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Ironhaven</title>
            <style>
              body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #0b1120;
                color: #e2e8f0;
                font-family: system-ui, sans-serif;
              }

              main {
                max-width: 720px;
                padding: 3rem;
                border: 1px solid #334155;
                border-radius: 1rem;
                background: #111827;
                box-shadow: 0 1rem 3rem rgb(0 0 0 / 35%);
              }

              h1 {
                margin-top: 0;
                color: #38bdf8;
              }

              code {
                color: #86efac;
              }
            </style>
          </head>
          <body>
            <main>
              <h1>Ironhaven</h1>
              <p>Infrastructure AWS sécurisée et reproductible.</p>
              <p>Service Nginx déployé avec <code>Ansible</code> dans un conteneur <code>Docker</code>.</p>
              <p>Administration distante assurée par <code>AWS Systems Manager</code>, sans SSH public.</p>
            </main>
          </body>
          </html>

    - name: Deploy Ironhaven Nginx container
      community.docker.docker_container:
        name: "{{ ironhaven_container_name }}"
        image: "{{ ironhaven_nginx_image }}:{{ ironhaven_nginx_image_tag }}"
        state: started
        restart_policy: unless-stopped
        pull: never
        published_ports:
          - "127.0.0.1:{{ ironhaven_local_port }}:80"
        volumes:
          - "{{ ironhaven_web_root }}:/usr/share/nginx/html:ro"

    - name: Wait for the Nginx service
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ ironhaven_local_port }}"
        status_code: 200
        return_content: true
      register: ironhaven_nginx_response
      retries: 10
      delay: 2
      until: ironhaven_nginx_response.status == 200
      changed_when: false

    - name: Verify the Ironhaven page
      ansible.builtin.assert:
        that:
          - "'Ironhaven' in ironhaven_nginx_response.content"
          - "'AWS Systems Manager' in ironhaven_nginx_response.content"
        success_msg: "Ironhaven Nginx service is healthy and serving the expected page."
        fail_msg: "Nginx responded, but the expected Ironhaven page was not returned."
