---
- name: Verify restricted PostgreSQL IAM authentication
  hosts: application
  become: true

  vars:
    app_root: /opt/ironhaven/application
    terraform_root: "{{ playbook_dir }}/../../terraform"

    db_metadata: >-
      {{
        lookup(
          'ansible.builtin.pipe',
          'terraform -chdir=' ~ terraform_root ~ ' output -json database'
        ) | from_json
      }}

  tasks:
    - name: Download official Amazon RDS CA bundle
      ansible.builtin.get_url:
        url: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
        dest: /etc/pki/tls/certs/rds-global-bundle.pem
        owner: root
        group: root
        mode: "0644"

    - name: Copy IAM database verification script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../files/database/test_iam_reader.py"
        dest: "{{ app_root }}/test_iam_reader.py"
        owner: ironhaven-app
        group: ironhaven-app
        mode: "0640"

    - name: Test IAM token, TLS and denied SQL write
      ansible.builtin.command:
        cmd: "{{ app_root }}/venv/bin/python {{ app_root }}/test_iam_reader.py"
      become: true
      become_user: ironhaven-app
      environment:
        AWS_REGION: eu-west-3
        DB_HOST: "{{ db_metadata.address }}"
        DB_NAME: "{{ db_metadata.name }}"
      register: security_result
      changed_when: false
      no_log: true

    - name: Display security validation
      ansible.builtin.debug:
        msg: "{{ security_result.stdout_lines }}"
