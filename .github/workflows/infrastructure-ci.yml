name: Infrastructure CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform | Format and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without remote backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  ansible:
    name: Ansible | YAML and Python Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Install YAML parser
        run: python -m pip install "PyYAML==6.0.2"

      - name: Validate Ansible YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          files = sorted(
              p for p in Path("ansible").rglob("*")
              if p.is_file() and p.suffix in (".yml", ".yaml")
              and ".terraform" not in p.parts
          )

          if not files:
              raise SystemExit("No Ansible YAML files found")

          for path in files:
              with path.open(encoding="utf-8") as f:
                  list(yaml.safe_load_all(f))
              print(f"PASS: {path}")

          print(f"Validated {len(files)} Ansible YAML files")
          PY

      - name: Check Python syntax
        run: python -m compileall -q ansible/files

      - name: Check repository whitespace
        run: git diff --check HEAD^ HEAD
