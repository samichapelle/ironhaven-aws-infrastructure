name: Infrastructure Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-iac:
    name: Trivy | Terraform IaC Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan Terraform and enforce reviewed risk baseline
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            config \
            --severity HIGH,CRITICAL \
            --format json \
            --exit-code 0 \
            /workspace/terraform > /tmp/ironhaven-trivy.json

          jq -r '
            [.Results[]? |
              .Target as $target |
              .Misconfigurations[]? |
              {target: $target, id: .ID, severity: .Severity}
            ] as $findings |
            $findings[] |
            "FINDING: \(.severity) \(.id) \(.target)"
          ' /tmp/ironhaven-trivy.json

          jq -e '
            [.Results[]? |
              .Target as $target |
              .Misconfigurations[]? |
              select(.Severity == "HIGH" or .Severity == "CRITICAL") |
              {target: $target, id: .ID}
            ] as $findings |
            all($findings[];
              (.id == "AWS-0164" and .target == "network.tf") or
              (.id == "AWS-0104" and .target == "security.tf") or
              (.id == "AWS-0132" and .target == "storage.tf")
            ) and
            ([ $findings[] |
               select(.id == "AWS-0164" and .target == "network.tf")
             ] | length == 1) and
            ([ $findings[] |
               select(.id == "AWS-0104" and .target == "security.tf")
             ] | length == 2) and
            ([ $findings[] |
               select(.id == "AWS-0132" and .target == "storage.tf")
             ] | length == 1)
          ' /tmp/ironhaven-trivy.json

          echo "PASS: No unexpected HIGH or CRITICAL IaC findings"

  ansible-lint:
    name: Ansible | Quality Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Ansible lint
        run: python -m pip install "ansible-lint>=25,<27"

      - name: Install Ansible collections
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            echo "Ansible Galaxy installation - attempt ${attempt}/3"

            if ansible-galaxy collection install \
              -r ansible/requirements.yml \
              --timeout 120; then
              echo "PASS: Ansible collections installed"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Galaxy temporarily unavailable; retrying..."
              sleep 15
            fi
          done

          echo "FAIL: Ansible Galaxy installation failed after 3 attempts"
          exit 1

      - name: Analyze Ansible playbooks
        shell: bash
        run: |
          set -euo pipefail
          ansible-lint --format=pep8 ansible/playbooks/*.yml
          echo "PASS: Ansible quality checks"
