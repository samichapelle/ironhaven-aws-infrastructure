name: Infrastructure Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-iac:
    name: Trivy | Terraform IaC Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Scan Terraform misconfigurations
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/workspace:ro" \
            aquasec/trivy@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --no-progress \
            /workspace/terraform

  ansible-lint:
    name: Ansible | Quality Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Ansible lint
        run: python -m pip install "ansible-lint>=25,<27"

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Analyze Ansible playbooks
        shell: bash
        run: |
          set -uo pipefail
          ansible-lint -p ansible/playbooks/*.yml
          RESULT=$?
          echo "ANSIBLE_LINT_EXIT_CODE=$RESULT"
          echo "AUDIT MODE: report only"
          exit 0
